# Flyway CLI configuration — drone-missionsv2
#
# Schema is owned by Flyway migrations in db/migration/ (V1..V18, copied unchanged from the
# Spring backend's src/main/resources/db/migration). Never write new DDL by hand and never let
# Drizzle migrate — see MIGRATION_PLAN.md §2-3 and src/db/schema.ts's header comment.
#
# Usage:
#   flyway -configFiles=flyway.conf migrate
#
# See README.md "Database migrations (Flyway)" for the full local-dev walkthrough.

flyway.locations=filesystem:db/migration

# flyway.url is intentionally NOT set here. The Flyway CLI automatically maps the environment
# variable FLYWAY_URL to the flyway.url config key (env vars take precedence over flyway.conf),
# so exporting FLYWAY_URL is enough — no placeholder substitution or -url= flag needed:
#   set -a; source .env.local; set +a   # exports FLYWAY_URL (and friends) from .env.local
#   flyway -configFiles=flyway.conf migrate
#
# FLYWAY_URL is a JDBC connection string, e.g.:
#   jdbc:postgresql://[project-ref].pooler.supabase.com:5432/postgres

# baseline-on-migrate=false matches the Spring backend's spring.flyway.baseline-on-migrate=false
# (application.properties): this app never adopts a pre-existing, non-Flyway-managed database —
# every target DB starts from V1.
flyway.baselineOnMigrate=false
