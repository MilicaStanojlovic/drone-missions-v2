# drone-missionsv2 — local dev stack
#
# Three services: the app itself, a `postgres:16` container as the
# documented drop-in local fallback for a Supabase project (same
# Flyway-managed schema, just not hosted), and a one-shot `flyway` runner
# that applies db/migration/ (V1..V18) to whichever Postgres FLYWAY_URL
# points at.
#
# Compose does NOT read .env.local automatically (it only reads a file
# literally named .env in this directory). Either export the vars into your
# shell first, or point Compose at the file explicitly:
#
#   docker compose --env-file .env.local up app
#   docker compose --env-file .env.local run --rm flyway migrate
#
# Any var left unset falls back to the localhost defaults below, which are
# wired to match this file's own `db` service credentials — enough to run
# the whole stack with zero configuration for local dev. Real
# Supabase/production values still belong only in .env.local (gitignored),
# never in this file.

services:
  # ---------------------------------------------------------------------------
  # The app itself (Dockerfile — Next.js standalone server).
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8085}:8085"
    environment:
      # List form (not the `KEY: value` map form) so RESEND_API_KEY/LOG_LEVEL
      # below can use the bare-name passthrough syntax: `- KEY` passes the
      # var through only when it's actually set in the shell/--env-file, and
      # omits it from the container entirely when it isn't. The map-form
      # equivalent, `KEY: ${KEY:-}`, always sets an explicit empty string
      # when unset — which src/lib/env.ts's Zod schema then rejects for any
      # optional field with a `.min(1)`/`z.enum` rule (RESEND_API_KEY,
      # LOG_LEVEL), crash-looping the container on the very "zero
      # configuration" default this compose file advertises.
      - NODE_ENV=production
      - PORT=8085
      # DATABASE_URL/FLYWAY_URL default to this compose file's own `db`
      # service (reachable by service name on the compose network) so the
      # stack works out of the box without a Supabase project.
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/dronemissions}
      - FLYWAY_URL=${FLYWAY_URL:-jdbc:postgresql://db:5432/dronemissions}
      # No committed default on purpose — see src/lib/env.ts's doc comment on
      # why this port, unlike Spring's dev-fallback secret, refuses to ship a
      # working default: a fallback here would mean every clone of this repo
      # signs real HS256 tokens with the same publicly-known key. Compose's
      # `${VAR:?err}` form fails the `up`/`run` command immediately with the
      # message below instead of silently substituting a value, so this stays
      # consistent with env.ts's fail-fast stance rather than reintroducing
      # the exact default it deliberately omits. Local dev: `openssl rand
      # -base64 32` into .env.local, then run with --env-file .env.local as
      # shown above.
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET — see .env.example}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - MAIL_FROM=${MAIL_FROM:-DroneMissions <no-reply@dronemissions.app>}
      # Bare-name passthrough (see the comment at the top of this block):
      # omitted from the container when unset, instead of the empty string
      # `${VAR:-}` would send — both are genuinely optional (RESEND_API_KEY
      # only required once MAIL_ENABLED=true; LOG_LEVEL falls back to a
      # pino default), and env.ts rejects an explicit empty string for both.
      - RESEND_API_KEY
      - LOG_LEVEL
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Local Postgres fallback — same role a Supabase dev project plays, just
  # self-hosted. Credentials here are the source of the sample
  # DATABASE_URL/FLYWAY_URL documented in .env.example.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dronemissions
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dronemissions"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # One-shot Flyway runner — applies db/migration/ (V1..V18) to `db`.
  # Not part of the default `docker compose up` graph (nothing depends on
  # it); invoke it explicitly:
  #
  #   docker compose run --rm flyway migrate
  #
  # The official image auto-loads every *.conf file under /flyway/conf, so
  # mounting our flyway.conf there still applies baselineOnMigrate=false —
  # no -configFiles flag needed. But flyway.conf's own
  # `flyway.locations=filesystem:db/migration` is written for local CLI use,
  # where the working directory is the repo root and db/migration/ sits
  # right under it; inside this container the working directory is /flyway
  # and the migrations are mounted at /flyway/sql (not /flyway/db/migration),
  # so that relative path would resolve to nothing. FLYWAY_LOCATIONS below
  # overrides it for the container specifically — env vars beat the mounted
  # conf file, per the same auto-mapping flyway.conf's comment describes for
  # FLYWAY_URL — pointing Flyway at the mount instead.
  # ---------------------------------------------------------------------------
  flyway:
    image: flyway/flyway:10-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migration:/flyway/sql:ro
      - ./flyway.conf:/flyway/conf/flyway.conf:ro
    environment:
      # Flyway CLI auto-maps FLYWAY_* env vars onto the matching
      # flyway.<key> config key (see flyway.conf's own comment on this for
      # FLYWAY_URL) — env vars take precedence over the mounted conf file,
      # so these four are enough; no other flags/args required beyond the
      # command itself (e.g. `migrate`, `info`, `validate`).
      FLYWAY_URL: jdbc:postgresql://db:5432/dronemissions
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      FLYWAY_LOCATIONS: filesystem:/flyway/sql

volumes:
  db-data:
